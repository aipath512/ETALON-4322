<!-- Inject on EVERY page of a verified and activated company site.
The generator replaces these placeholders with verified values, escaped as HTML attributes.
The widget itself fetches ONLY approved company data from the central D1 service. -->
<script defer src="https://scara.dev/assistant/widget.js"
  data-site-key="{{APPROVED_SITE_KEY}}"
  data-company="{{VERIFIED_COMPANY_NAME}}"
  data-api="https://scara.dev/api/site-assistant"></script>
