name: Gate 0 KB integrity
on:
  pull_request:
  push:
    branches:
      - feature/scara-ai-kb-contract-v3
jobs:
  gate0:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Gate 0 unit tests
        run: node --test kb/gate0/*.test.mjs
